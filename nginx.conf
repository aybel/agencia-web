server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vue Router (modo history): cualquier ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash de Vite: cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea para que los despliegues se vean al instante
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
